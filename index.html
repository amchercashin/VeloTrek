<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Вёрсты — веломаршруты без интернета</title>
    <meta name="description" content="Веломаршруты по Москве и Подмосковью с офлайн-картами и GPS-навигацией без интернета." />
    <meta name="theme-color" content="#f4f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b100d" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Вёрсты" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
    <link rel="preload" href="fonts/onest-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="brand-mark" viewBox="0 0 512 512">
        <defs>
          <linearGradient id="vk-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a2d22"/><stop offset=".72" stop-color="#1a6a4d"/><stop offset="1" stop-color="#2d8f66"/></linearGradient>
          <radialGradient id="vk-sun" cx="50%" cy="40%" r="62%"><stop offset="0" stop-color="#ffd09a"/><stop offset=".5" stop-color="#ff7a3c"/><stop offset="1" stop-color="#ff4a10"/></radialGradient>
          <linearGradient id="vk-hill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#11523b"/><stop offset="1" stop-color="#05201a"/></linearGradient>
          <linearGradient id="vk-vol" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".22"/><stop offset=".4" stop-color="#fff" stop-opacity=".2"/><stop offset="1" stop-color="#000" stop-opacity=".34"/></linearGradient>
          <clipPath id="vk-pc"><path d="M318 186a9 9 0 0 1 9-9H387a9 9 0 0 1 9 9V376H318Z"/></clipPath>
          <clipPath id="vk-tile"><rect width="512" height="512" rx="116"/></clipPath>
        </defs>
        <g clip-path="url(#vk-tile)">
          <rect width="512" height="512" fill="url(#vk-sky)"/>
          <circle cx="228" cy="322" r="182" fill="url(#vk-sun)"/>
          <path d="M0 384C84 352 176 344 262 360C352 376 430 362 512 340V512H0Z" fill="#1f7556" opacity=".75"/>
          <path d="M0 398C120 352 380 346 512 378V512H0Z" fill="url(#vk-hill)"/>
          <path d="M-10 512C120 484 262 442 330 380H398C330 456 236 496 150 512Z" fill="#f4f3ee"/>
          <path d="M-10 512C120 484 262 442 330 380" stroke="#fff" stroke-width="3" fill="none" opacity=".9"/>
          <path d="M60 512C190 478 290 436 362 382" stroke="#0f3d2c" stroke-opacity=".5" stroke-width="5" stroke-dasharray="14 15" fill="none"/>
          <ellipse cx="358" cy="380" rx="66" ry="10" fill="#000" opacity=".42"/>
          <g clip-path="url(#vk-pc)">
            <rect x="310" y="170" width="94" height="212" fill="#f4f3ee"/>
            <path d="M296 262l190-190M296 328l190-190M296 394l190-190M296 460l190-190M296 526l190-190M296 592l190-190" stroke="#0f3d2c" stroke-width="23.3" fill="none"/>
            <rect x="310" y="170" width="94" height="212" fill="url(#vk-vol)"/>
            <rect x="310" y="180" width="94" height="10" fill="#ff5a1f"/>
          </g>
        </g>
      </symbol>
    </svg>

    <div id="catalog" class="catalog-view"></div>
    <section id="route" class="route-view" hidden></section>

    <noscript><p class="noscript">Для работы «Вёрст» нужен JavaScript.</p></noscript>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
