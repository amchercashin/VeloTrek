<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Вёрсты</title>
    <!-- Старые ссылки route.html?route=… ведут на новый адрес маршрута -->
    <script>
      (function () {
        var id = new URLSearchParams(location.search).get("route");
        location.replace("./" + (id ? "#/r/" + encodeURIComponent(id) : ""));
      })();
    </script>
  </head>
  <body></body>
</html>
